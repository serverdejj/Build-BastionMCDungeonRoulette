# BASTION MC Dungeon Roulette V6 - hologramas con escala y altura por LINEA y por MAPA.
# Colores: &a, &l, &#RRGGBB, degradados caracter por caracter: &#2529A7&le&#2822A6&lj...
# Cada linea tiene text, height, scale, offset-x, offset-y, offset-z y background-opacity.
# background-opacity: 0 = transparente (por defecto), 255 = fondo negro opaco.
# height es el desplazamiento VERTICAL de ESA linea respecto a la base del holograma.
# La base es: posicion ruleta + winner-hologram.height + hologram.height del mapa.
# Se mantienen guardados los 3 bloques originales en 'blocks'.
# Los cambios en config.yml se aplican con /droulette reload.
roulette:
  duration-ticks: 130
  scroll-steps: 28
  winner-pause-ticks: 60
  sound: BLOCK_NOTE_BLOCK_HAT
  volume: 0.45
  pitch: 1.4
  display-height: 1.4
  image-scale: 0.72
  card-spacing: 1.18
  cards-left: 2
  cards-right: 4
  slide-direction: right
  nearby-title-radius: 20
  title-fade-in-ticks: 10
  title-stay-ticks: 65
  title-fade-out-ticks: 15
  title-format: '&#BA8AFFDungeon &f{map}'
  subtitle-format: '&7{description}'
  maps:
  - id: dungeon1-endlessxl
    name: dungeon1-endlessxl
    description: Una aventura en las profundidades
    weight: 1
    model: bastionroulette:dungeon1_endlessxl
    hologram:
      enabled: true
      height: 0.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      line-spacing: 0.35
      scale: 0.75
      background-opacity: 0
      lines:
      - text: '&#2529A7&lM&#2822A6&la&#2C1CA6&lp&#2F15A5&la &#3420AF&lG&#3A2CBA&la&#3F37C4&ln&#4542CD&la&#4B4DD6&ld&#5158DF&lo&#5763E8&lr'
        height: 0.92
        scale: 0.72
        background-opacity: 0
        offset-x: 0.0
        offset-y: 0.0
        offset-z: 0.0
      - text: '&f&l{name}'
        height: 0.44
        scale: 0.6
        background-opacity: 0
        offset-x: 0.0
        offset-y: 0.0
        offset-z: 0.0
      - text: '&7Mata a el jefe para ganar'
        height: 0.03
        scale: 0.38
        background-opacity: 0
        offset-x: 0.0
        offset-y: 0.0
        offset-z: 0.0
  - id: the-labyrinth
